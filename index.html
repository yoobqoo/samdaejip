function badgeBg(region,cat,frac){ return badgeBgOf(badgeFor(region,cat),frac); }

const LS={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};

/* ===== 상태 ===== */
const state={ screen:"home", region:null, curListId:null, lists:{}, order:[], regions:[], votes:{}, loaded:false, stamp:false, certRegion:"전체", expanded:{}, comments:{}, myLikes:{} };
let myVotes={}; // { listId: [candId,...] } — 카테고리당 최대 3곳, 로그인 시 서버(user_votes)에서 로드

function currentUser(){
  if(session){ const u=session.user, m=u.user_metadata||{}, a=u.app_metadata||{};
    return {provider:a.provider||"kakao", name:(m.name||m.nickname||m.full_name||u.email||"사용자"), id:u.id}; }
  if(guest) return {provider:"guest", name:"게스트", guest:true};
  return null;
}
async function loadMyVotes(){ myVotes={}; if(!session) return; try{ const {data}=await db.from("user_votes").select("list_id,candidate_id"); (data||[]).forEach(r=>{ (myVotes[r.list_id]=myVotes[r.list_id]||[]).push(r.candidate_id); }); }catch(e){ console.warn(e); } }
function photos(){ try{ return JSON.parse(LS.get("sdj_photos")||"{}"); }catch(e){ return {}; } }

function isCertified(id){ return !!photos()[id]; }
function certCount(){ return Object.keys(photos()).length; }

/* ===== CSV 파싱 ===== */
function splitCsvLine(line){ const out=[]; let cur="",q=false; for(let i=0;i<line.length;i++){ const ch=line[i];
  if(q){ if(ch=='"'){ if(line[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
  else { if(ch=='"')q=true; else if(ch==','){ out.push(cur); cur=""; } else cur+=ch; } } out.push(cur); return out; }
function parseCSV(text){ const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim().length);
  const head=splitCsvLine(lines[0]).map(h=>h.trim());
  return lines.slice(1).map(l=>{ const c=splitCsvLine(l); const o={}; head.forEach((h,i)=>o[h]=(c[i]||"").trim()); return o; }); }
function buildLists(rows){
  const lists={}, order=[], regions=[], rseen={};
  rows.forEach(r=>{ if(!r.list||!r.id) return;
    if(!lists[r.list]){ lists[r.list]={id:r.list,region:r.region||"",category:r.category||"",title:r.list||((r.region||"")+" "+(r.category||"")).trim(),cands:[]}; order.push(r.list);
      if(!rseen[r.region]){ rseen[r.region]=1; regions.push(r.region); } }
    lists[r.list].cands.push({id:r.id,name:r.name||r.id,district:r.district||"",blurb:r.blurb||"",signature:r.signature||"",order:parseInt(r.order)||999,photo:r.photo||""});
  });
  Object.values(lists).forEach(L=>L.cands.sort((a,b)=>a.order-b.order));
  return {lists,order,regions};
}

/* ===== 로드 ===== */
async function fetchSheet(){ const res=await fetch(SHEET_CSV); if(!res.ok) throw new Error("sheet "+res.status); return parseCSV(await res.text()); }
async function fetchVotes(){ const {data,error}=await db.from("vote_counts").select("id,count"); const m={}; if(!error&&data) data.forEach(r=>m[r.id]=r.count); return m; }
const FALLBACK_CSV=`list,region,category,id,name,district,blurb,signature,order
서울 3대 평냉,서울,평양냉면,uraeok,우래옥,중구 주교동,묵직한 육수의 교과서,불고기 백반,1
서울 3대 평냉,서울,평양냉면,eulmil,을밀대,마포구 염리동,진한 살얼음 육수,제육,2
서울 3대 평냉,서울,평양냉면,pildong,필동면옥,중구 필동,슴슴함의 정석,제육,3
서울 3대 평냉,서울,평양냉면,bong,봉피양,강남구 방이동,정갈한 한 그릇,녹두전,4
서울 3대 평냉,서울,평양냉면,pyeongrae,평래옥,중구 을지로,노포의 품격,만두,5
서울 3대 평냉,서울,평양냉면,jinmi,진미평양냉면,강남구 논현,구수한 면수,제육,6
서울 3대 평냉,서울,평양냉면,nampo,남포면옥,중구 무교동,깔끔한 국물,빈대떡,7
서울 3대 평냉,서울,평양냉면,jungin,정인면옥,중구 주교동,가성비 노포,만두,8`;
async function load(){
  try{ const {data}=await db.auth.getSession(); session=data.session||null; }catch(e){}
  db.auth.onAuthStateChange(async (_e,s)=>{ session=s; await loadMyVotes(); render(); });

  let votes={}; try{ votes=await fetchVotes(); }catch(e){ console.warn("[삼대집] 표 로드 실패:", e.message); }
  await loadMyVotes();
  const b=buildLists(rows); state.lists=b.lists; state.order=b.order; state.regions=b.regions; state.votes=votes;
  if(!state.region) state.region=b.regions[0]||null;
  if(!state.curListId) state.curListId=b.order[0]||null;

/* ===== 파생 ===== */
const vote=id=>state.votes[id]||0;
function listsInRegion(rg){ return state.order.filter(id=>state.lists[id].region===rg); }
function candsRanked(listId){ const L=state.lists[listId]; if(!L) return []; return [...L.cands].map(c=>({...c,v:vote(c.id)})).sort((a,b)=>b.v-a.v); }
function listTotal(listId){ const L=state.lists[listId]; return L? L.cands.reduce((a,c)=>a+vote(c.id),0):0; }
function top3(listId){ return candsRanked(listId).slice(0,3); }
function allCertified(listId){ const t=top3(listId); return t.length===3 && t.every(s=>isCertified(s.id)); }

/* ===== 투표 (카테고리당 최대 3곳 선택 · 토글) ===== */
let busy=false;
async function castVote(listId,id){
  if(busy) return;
  if(!session){ toast("카카오로 로그인하고 투표하세요"); go("me"); return; }
  const picks=picksOf(listId); const has=picks.includes(id);
  if(!has && picks.length>=MAX_PICKS){ toast("최대 3곳까지 선택할 수 있어요"); return; }
  busy=true; const adding=!has;
  if(has){ state.votes[id]=Math.max(0,vote(id)-1); myVotes[listId]=picks.filter(x=>x!==id); }
  else{ state.votes[id]=vote(id)+1; myVotes[listId]=[...picks,id]; }
  if(navigator.vibrate)navigator.vibrate(adding?[8,26,12]:16);
  render();                       // animEnter=false → 화면 깜빡임 없음
  if(adding) popVote(id);         // 방금 누른 버튼만 팝
  try{ await db.rpc("toggle_vote",{p_list:listId,p_candidate:id}); }catch(e){ console.error(e); toast("투표 실패 — 다시 시도"); }
  busy=false;
  try{ state.votes=await fetchVotes(); }catch(e){}   // 서버 최신값 조용히 반영(재렌더 X → 애니메이션 안 끊김)
}

/* ===== 사진 인증 (EXIF 촬영일) ===== */
let pickTarget=null;
const picker=document.getElementById("picker");
function openCert(id){ pickTarget=id; picker.value=""; picker.click(); }
async function exifDate(file){
  try{
    const buf=await file.slice(0,256*1024).arrayBuffer(); const dv=new DataView(buf);
    if(dv.getUint16(0)!==0xFFD8) return null; let off=2;
    while(off<dv.byteLength-4){ const marker=dv.getUint16(off);
      if(marker===0xFFE1){ const s=off+4; if(dv.getUint32(s)!==0x45786966) return null;
        const tiff=s+6; const little=dv.getUint16(tiff)===0x4949; const g16=o=>dv.getUint16(o,little),g32=o=>dv.getUint32(o,little);
        const ifd0=tiff+g32(tiff+4); let exifIFD=0,n=g16(ifd0);
        for(let i=0;i<n;i++){ const e=ifd0+2+i*12; if(g16(e)===0x8769){ exifIFD=tiff+g32(e+8); break; } }
        if(!exifIFD) return null; n=g16(exifIFD);
        for(let i=0;i<n;i++){ const e=exifIFD+2+i*12; const tag=g16(e);
          if(tag===0x9003||tag===0x9004){ const cnt=g32(e+4); const vo=cnt>4?tiff+g32(e+8):e+8; let str="";
            for(let c=0;c<cnt-1;c++) str+=String.fromCharCode(dv.getUint8(vo+c));
            const m=str.match(/(\d{4}):(\d{2}):(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]); } }
        return null; }
      if((marker&0xFF00)!==0xFF00) break; const size=dv.getUint16(off+2); if(size<2) break; off+=2+size; }
  }catch(e){} return null;
}
picker.addEventListener("change", async (e)=>{
  const f=e.target.files[0]; if(!f||!pickTarget) return;
  const wasComplete=allCertified(state.curListId);
  const ex=await exifDate(f); const d=ex||(f.lastModified? new Date(f.lastModified): new Date());
  const dateStr=d.toLocaleDateString("ko-KR",{year:"2-digit",month:"2-digit",day:"2-digit"});
  const rd=new FileReader();
  rd.onload=(ev)=>{ const img=new Image(); img.onload=()=>{
    const max=720; let{width:w,height:h}=img;
    if(w>h&&w>max){h=h*max/w;w=max;} else if(h>max){w=w*max/h;h=max;}
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
    const url=cv.toDataURL("image/jpeg",0.72);
    const p=photos(); p[pickTarget]={photo:url,date:dateStr,src:ex?"exif":"file"}; setPhotos(p);
    pickTarget=null; if(navigator.vibrate)navigator.vibrate(40);
    if(!wasComplete && allCertified(state.curListId)){ state.stamp=true; if(navigator.vibrate)navigator.vibrate([0,55,60,130]); }
    toast((ex?"📷 촬영일 ":"🗓 ")+dateStr+" 방문으로 인증됐어요"); render();
  }; img.src=ev.target.result; };
  rd.readAsDataURL(f);

/* ---- 성지순례 공유(스크린샷) ---- */
function ensureH2C(){ return new Promise((res,rej)=>{ if(window.html2canvas) return res(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('h2c load fail')); document.head.appendChild(s); }); }
let sharing=false;
async function shareCert(){
  if(sharing) return; const el=document.getElementById('shareArea'); if(!el) return;
  const L=state.lists[state.curListId]; const title=L?L.title:'성지순례';
  sharing=true; toast('이미지 만드는 중…');
  try{
    await ensureH2C();
    const canvas=await html2canvas(el,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png',0.95));
    if(!blob){ toast('이미지 생성 실패'); sharing=false; return; }
    const file=new File([blob],'삼대집_'+title+'.png',{type:'image/png'});
    const data={files:[file],title:'삼대집 성지순례',text:title+' 성지순례 인증! · 삼대집'};
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share(data); }catch(e){}
    }else{
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
      toast('이미지를 저장했어요 — 공유해보세요');
    }
  }catch(e){ console.error(e); toast('공유 준비 중 오류가 났어요'); }
  sharing=false;
}

    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px">
      ${stats.map(s=>`<div style="background:#fff;border-radius:18px;padding:16px 12px;text-align:center"><div style="font:800 26px/1 Pretendard;letter-spacing:-.04em;color:#f53d0c">${s[0]}</div><div style="font:600 11px/1.3 Pretendard;color:rgba(10,10,10,.45);margin-top:7px">${s[1]}</div></div>`).join("")}
    </div>
    <div style="font:700 11px/1 Pretendard;letter-spacing:.14em;color:rgba(10,10,10,.4);margin:24px 0 11px">계정</div>
    <div style="display:flex;flex-direction:column;gap:7px">
      ${rows.map(r=>`<div style="display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:15px 16px"><div style="flex:1;font:600 13.5px/1.3 Pretendard;color:#0a0a0a">${r[0]}</div><div style="font:500 12px/1 Pretendard;color:rgba(10,10,10,.4)">${r[1]}</div></div>`).join("")}
    </div>
    <button onclick="logout()" style="width:100%;margin-top:18px;cursor:pointer;border:1px solid rgba(10,10,10,.14);background:transparent;color:rgba(10,10,10,.55);font:700 12.5px/1 Pretendard;padding:15px;border-radius:99px">로그아웃</button>
  </div>`;
}

/* ---- 기타 폴백 ---- */
function viewSoon(){
  return `<div style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px;text-align:center;${ea('b3in','.3s')}">
    <div style="font:800 22px/1.2 Pretendard;color:#0a0a0a">곧 나와요</div>
    <button onclick="go('home')" style="border:none;background:#0a0a0a;color:#fff;font:700 13px/1 Pretendard;padding:13px 20px;border-radius:99px;cursor:pointer">홈으로</button></div>`;
}

/* ---- 네비 ---- */
function navBar(){
  const item=(id,label)=>{ const on=state.screen===id||(id==="home"&&state.screen==="list")||(id==="cert"&&state.screen==="detail");
    return `<button onclick="go('${id}')" style="flex:1;border:none;background:none;cursor:pointer;padding:12px 0 calc(12px + env(safe-area-inset-bottom));font:700 12px/1 Pretendard;color:${on?"#0a0a0a":"rgba(10,10,10,.4)"};position:relative">${label}${on?`<span style="position:absolute;top:0;left:38%;right:38%;height:3px;background:#f53d0c;border-radius:99px"></span>`:""}</button>`; };
  return `<nav style="position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid rgba(10,10,10,.08);z-index:60">${item("home","홈")}${item("cert","성지순례")}${item("me","마이페이지")}</nav>`;
}
let toastT; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

load();
</script>
</body>
</html>
